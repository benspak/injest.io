<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .auth-section {
      text-align: center;
      padding: 20px 0;
    }
    .auth-section button {
      background: #4285f4;
    }
    .status {
      padding: 8px;
      margin: 8px 0;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .link-input {
      display: flex;
      gap: 8px;
    }
    .link-input input {
      flex: 1;
    }
  </style>
</head>
<body>
  <h1>Save to Brain</h1>

  <div id="auth-section" class="auth-section">
    <p>Sign in to save items</p>
    <button id="signin-btn">Sign in with Google</button>
  </div>

  <div id="capture-section" style="display: none;">
    <div class="link-input">
      <input type="text" id="url-input" placeholder="Paste URL or text..." />
      <button id="save-url-btn">Save</button>
    </div>
    <textarea id="note-input" placeholder="Or type a note..."></textarea>
    <button id="save-note-btn">Save Note</button>
    <button id="save-page-btn">Save Current Page</button>
    <button id="logout-btn" style="background: #ef4444; margin-top: 16px;">Sign Out</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>

services:
  # Backend API
  - type: web
    name: brain-ai-api
    env: node
    plan: starter
    rootDir: packages/api
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm postdeploy && pnpm db:migrate && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: brain-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: brain-ai-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: BASE_URL
        fromService:
          name: brain-ai-frontend
          type: web
          property: host
    healthCheckPath: /health

  # Frontend
  - type: web
    name: brain-ai-frontend
    env: node
    plan: starter
    rootDir: packages/frontend
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: brain-ai-api
          type: web
          property: host

  # Background Workers
  - type: worker
    name: brain-ai-workers
    env: node
    plan: starter
    rootDir: packages/api
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/jobs/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brain-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: brain-ai-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: brain-ai-db
    databaseName: brain_ai
    user: brain_ai
    plan: starter
    # Note: Enable pgvector extension via postdeploy script or manually

redis:
  - name: brain-ai-redis
    plan: starter
